---
# Post-deployment checks for the baseline (site.yml) and the cluster (k8s.yml).
- name: Verify baseline services on all nodes
  hosts: all
  become: true
  tasks:
    - name: Check that containerd is active
      ansible.builtin.command: systemctl is-active containerd
      register: containerd_state
      changed_when: false
      failed_when: containerd_state.stdout != "active"

    - name: Check that qemu-guest-agent is active
      ansible.builtin.command: systemctl is-active qemu-guest-agent
      register: guest_agent_state
      changed_when: false
      failed_when: guest_agent_state.stdout != "active"

    - name: Check that no swap is active
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: swap_state
      changed_when: false
      failed_when: swap_state.stdout | length > 0

- name: Verify the Kubernetes cluster on the master node
  hosts: master
  become: true
  tasks:
    - name: Check that kubelet is active
      ansible.builtin.command: systemctl is-active kubelet
      register: kubelet_state
      changed_when: false
      failed_when: kubelet_state.stdout != "active"

    - name: Wait for all nodes to be Ready
      ansible.builtin.command:
        cmd: >
          kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes
          -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
      register: ready_states
      changed_when: false
      until: ready_states.stdout_lines | length > 0 and "False" not in ready_states.stdout_lines and "Unknown" not in ready_states.stdout_lines
      retries: 30
      delay: 10

    - name: Show cluster nodes
      ansible.builtin.command:
        cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o wide
      register: nodes
      changed_when: false

    - name: Cluster overview
      ansible.builtin.debug:
        var: nodes.stdout_lines
