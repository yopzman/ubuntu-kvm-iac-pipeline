---
- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present

- name: Enable and start prometheus-node-exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true

- name: Allow node-exporter scrapes from the libvirt network only
  ansible.builtin.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    from_ip: "{{ node_exporter_allow_from }}"
