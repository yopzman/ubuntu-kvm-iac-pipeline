---
- name: Harden SSH configuration (sshd drop-in)
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    create: true
    owner: root
    group: root
    mode: "0644"
    block: |
      # SSH hardening - managed by Ansible
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 4
      ClientAliveInterval 300
      ClientAliveCountMax 2
      LoginGraceTime 30
  notify: Restart ssh

- name: Allow OpenSSH through UFW
  ansible.builtin.ufw:
    rule: allow
    name: OpenSSH

- name: Set default incoming policy to deny
  ansible.builtin.ufw:
    default: deny
    direction: incoming

- name: Enable UFW
  ansible.builtin.ufw:
    state: enabled

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Remove the 'packer' builder user from the golden image
  ansible.builtin.user:
    name: packer
    state: absent
    remove: true
    force: true
  when: not bake_image

- name: Remove the temporary sudoers file for the packer user
  ansible.builtin.file:
    path: /etc/sudoers.d/99-packer
    state: absent
  when: not bake_image
