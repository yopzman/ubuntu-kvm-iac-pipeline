---
- name: Install containerd dan paket pendukung
  ansible.builtin.apt:
    name:
      - containerd
      - conntrack
      - socat
    state: present

- name: Generate konfigurasi default containerd
  ansible.builtin.shell: "containerd config default > /etc/containerd/config.toml"
  args:
    creates: /etc/containerd/config.toml

- name: Aktifkan systemd cgroup driver
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^\s*SystemdCgroup\s*=.*$'
    line: '          SystemdCgroup = true'
  notify: Restart containerd

- name: Set sandbox image (pause) agar kompatibel Kubernetes
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^\s*sandbox_image\s*=.*$'
    line: '  sandbox_image = "registry.k8s.io/pause:3.9"'
  notify: Restart containerd

- name: Aktifkan dan jalankan containerd
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true
