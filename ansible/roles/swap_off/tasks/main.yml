---
- name: Cek swap yang sedang aktif
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: swap_devices
  changed_when: false

- name: Matikan semua swap
  ansible.builtin.command: swapoff -a
  when: swap_devices.stdout | length > 0

- name: Komentari entri swap di /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s].*\s+swap\s+.*)$'
    replace: '# \1  # dinonaktifkan oleh Ansible (swap_off)'
