---
- name: Muat modul kernel untuk runtime container
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Persistensi modul kernel saat boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Terapkan sysctl untuk workload container
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-container.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Sysctl prasyarat container/Kubernetes - dikelola Ansible
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      vm.swappiness                       = 0
      net.core.somaxconn                  = 1024
      net.ipv4.tcp_keepalive_time         = 600
      fs.file-max                         = 2097152
  notify: Reload sysctl
