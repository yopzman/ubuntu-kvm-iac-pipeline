# Static inventory — set ansible_host to the IPs from:
#   terraform -chdir=../terraform output master_ips
#   terraform -chdir=../terraform output worker_ips

[master]
master-1 ansible_host=192.168.122.50

[workers]
worker-1 ansible_host=192.168.122.51
worker-2 ansible_host=192.168.122.52

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
